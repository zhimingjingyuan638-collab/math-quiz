<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数学パーク | よるのゆうえんちで ぼうけん！</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --night-0: #070b21;
      --night-1: #0d1330;
      --night-2: #182052;
      --panel-dark: rgba(22,30,70,0.88);
      --panel-line: #2c3a7a;
      --paper: #fffdf6;
      --ink: #26244d;
      --ink-soft: #6b7280;
      --text-hi: #eef1ff;
      --text-mid: #a9b3e0;
      --gold: #ffc93c;
      --gold-deep: #f5a524;
      --pink: #ff6b9d;
      --green: #3ddc84;
      --green-deep: #16a34a;
      --cyan: #41d6e3;
      --purple: #8b5cf6;
      --red: #ff5d5d;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
      background: linear-gradient(180deg, #070b21 0%, #0d1330 45%, #182052 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-hi);
      overflow-x: hidden;
    }

    /* ── 夜空（星・浮遊記号） ── */
    .night-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .night-bg .tw {
      position: absolute; border-radius: 50%; background: #dfe6ff;
      animation: twinkle ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    .night-bg .fl { position: absolute; font-weight: 900; opacity: 0; animation: floatUp linear infinite; }
    @keyframes floatUp {
      0%   { transform: translateY(105vh) rotate(0deg);   opacity: 0; }
      8%   { opacity: 0.5; }
      92%  { opacity: 0.5; }
      100% { transform: translateY(-8vh) rotate(360deg); opacity: 0; }
    }
    .park-skyline {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 0;
      pointer-events: none; opacity: 0.55; line-height: 0;
    }
    .park-skyline svg { width: 100%; height: auto; display: block; }
    #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 200; }

    /* ── 数式表記（教科書風。既存クラスを維持） ── */
    .mn { font-family: 'Times New Roman', 'Georgia', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-style: italic; }
    .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 1px; font-size: 0.82em; line-height: 1.15; }
    .frac-num { border-bottom: 1.5px solid currentColor; padding: 0 3px 1px; text-align: center; min-width: 1em; }
    .frac-den { padding: 1px 3px 0; text-align: center; min-width: 1em; }

    /* ═══════════ ヒーロー（マップの看板） ═══════════ */
    .park-hero {
      position: relative; z-index: 1;
      max-width: 900px; margin: 0 auto;
      padding: 34px 22px 10px;
      display: flex; align-items: center; gap: 16px;
    }
    .hero-nyake { flex-shrink: 0; width: 96px; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)); }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
    .park-hero h1 {
      font-size: clamp(1.9rem, 7vw, 3.1rem); font-weight: 900; letter-spacing: 0.03em;
      background: linear-gradient(180deg, #fff3c4 20%, var(--gold) 60%, var(--gold-deep));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 4px 22px rgba(255,201,60,0.25);
      line-height: 1.1;
    }
    .hero-sub { color: var(--text-mid); font-size: 0.9rem; font-weight: 800; margin-top: 6px; }
    .hero-marquee {
      max-width: 900px; margin: 8px auto 0; height: 8px; border-radius: 4px;
      background: repeating-linear-gradient(90deg, var(--gold) 0 8px, transparent 8px 26px);
      opacity: 0.8; animation: marquee 1.2s steps(2) infinite;
    }
    @keyframes marquee { 50% { opacity: 0.25; } }

    /* ── にゃけちのふきだし ── */
    .nyake-line { position: relative; z-index: 1; max-width: 900px; margin: 14px auto 0; padding: 0 22px; }
    .nyake-bubble {
      background: var(--panel-dark); border: 2px solid var(--panel-line); border-radius: 16px;
      padding: 12px 16px; font-size: 0.92rem; font-weight: 800; color: var(--text-hi);
      position: relative; box-shadow: 0 6px 22px rgba(0,0,0,0.35);
    }
    .nyake-bubble::before {
      content: ''; position: absolute; left: 34px; top: -9px;
      width: 15px; height: 15px; background: var(--panel-dark);
      border-left: 2px solid var(--panel-line); border-top: 2px solid var(--panel-line);
      transform: rotate(45deg);
    }

    /* ── 進捗サマリー ── */
    .park-summary {
      position: relative; z-index: 1; max-width: 900px; margin: 0 auto;
      display: flex; gap: 10px; padding: 16px 22px 0; flex-wrap: wrap;
    }
    .psum {
      flex: 1; min-width: 110px; text-align: center;
      background: var(--panel-dark); border: 2px solid var(--panel-line); border-radius: 16px;
      padding: 12px 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .psum-num { font-size: 1.45rem; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
    .psum-label { font-size: 0.68rem; color: var(--text-mid); margin-top: 2px; font-weight: 800; }
    .total-bar-wrap { position: relative; z-index: 1; max-width: 900px; margin: 12px auto 0; padding: 0 22px; }
    .total-bar { height: 12px; border-radius: 7px; background: rgba(255,255,255,0.08); border: 1.5px solid var(--panel-line); overflow: hidden; }
    .total-bar i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--gold-deep), var(--gold), #ffe58a); box-shadow: 0 0 12px rgba(255,201,60,0.6); transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
    .total-bar-label { text-align: right; font-size: 0.68rem; color: var(--text-mid); font-weight: 800; margin-top: 4px; }

    /* ═══════════ ワールドマップ ═══════════ */
    #map-screen { position: relative; z-index: 1; padding-bottom: 90px; }
    #worlds-container { max-width: 900px; margin: 0 auto; padding: 6px 18px 30px; }
    .grade-heading {
      display: flex; align-items: center; gap: 10px;
      margin: 36px 4px 4px; font-size: 1rem; font-weight: 900; color: var(--gold);
      letter-spacing: 0.06em;
    }
    .grade-heading svg { flex-shrink: 0; }
    .grade-heading::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, var(--panel-line), transparent); border-radius: 2px; }

    .world-card {
      position: relative;
      background: var(--panel-dark); border-radius: 22px; border: 2px solid var(--panel-line);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      padding: 18px 20px 20px; margin-top: 18px;
      animation: cardIn 0.45s ease-out both;
      backdrop-filter: blur(4px);
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .world-card.locked-world { opacity: 0.6; filter: saturate(0.35); }
    .world-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
    .world-boss {
      width: 62px; height: 62px; border-radius: 16px; flex-shrink: 0;
      background: radial-gradient(circle at 50% 30%, #26306b, #131a41);
      border: 2px solid var(--panel-line);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .world-boss svg { width: 52px; height: 52px; }
    .world-info { flex: 1; min-width: 150px; }
    .world-name { font-size: 1.08rem; font-weight: 900; color: var(--text-hi); }
    .world-sub { font-size: 0.72rem; color: var(--text-mid); margin-top: 2px; font-weight: 700; }
    .world-bar { margin-top: 7px; height: 8px; border-radius: 5px; background: rgba(255,255,255,0.08); overflow: hidden; max-width: 260px; }
    .world-bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width 0.5s; }
    .world-stars {
      font-size: 0.82rem; font-weight: 900; color: var(--gold);
      background: rgba(255,201,60,0.1); border: 1.5px solid rgba(255,201,60,0.45);
      border-radius: 99px; padding: 5px 13px; white-space: nowrap;
    }
    .world-lock-note { font-size: 0.74rem; font-weight: 800; color: var(--text-mid); display: flex; align-items: center; gap: 6px; }

    /* ── ステージの道 ── */
    .stage-path { display: flex; flex-wrap: wrap; align-items: flex-end; row-gap: 20px; padding-top: 46px; }
    .stage-wrap { display: flex; align-items: center; }
    .stage-wrap:not(:last-child)::after {
      content: ''; width: 24px; height: 6px; border-radius: 3px; margin: 0 2px 46px;
      background: repeating-linear-gradient(90deg, #33406f 0 7px, transparent 7px 12px);
    }
    .stage-wrap.done:not(:last-child)::after {
      background: repeating-linear-gradient(90deg, var(--gold) 0 7px, rgba(255,201,60,0.15) 7px 12px);
    }

    .stage-node {
      position: relative; width: 78px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; cursor: pointer; font-family: inherit; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .node-nyake { position: absolute; top: -46px; left: 50%; transform: translateX(-50%); width: 46px; pointer-events: none; animation: bob 1.7s ease-in-out infinite; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); z-index: 2; }
    .stage-circle {
      width: 60px; height: 60px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 900; font-size: 0.95rem; color: #fff; position: relative;
      background: linear-gradient(160deg, #4759c7, #2b3a97);
      border: 3px solid #6a7ce0; box-shadow: 0 5px 0 #131a41, 0 8px 18px rgba(0,0,0,0.4);
      transition: transform 0.16s;
    }
    .stage-node:hover .stage-circle { transform: translateY(-3px) scale(1.06); }
    .stage-node:active .stage-circle { transform: translateY(2px); box-shadow: 0 2px 0 #131a41; }
    .stage-node.cleared .stage-circle {
      background: linear-gradient(160deg, #ffd968, var(--gold-deep));
      border-color: #ffe9a8; color: #4b3200;
      box-shadow: 0 5px 0 #7a5410, 0 8px 20px rgba(255,201,60,0.35);
    }
    .stage-node.locked { cursor: default; }
    .stage-node.locked .stage-circle { background: #232a52; border-color: #333d76; color: #55609c; box-shadow: 0 5px 0 #10152f; }
    .stage-node.next .stage-circle { animation: nextPulse 1.5s ease-in-out infinite; border-color: #b9f6ce; }
    @keyframes nextPulse {
      0%,100% { box-shadow: 0 5px 0 #131a41, 0 0 0 0 rgba(61,220,132,0.55); }
      50%     { box-shadow: 0 5px 0 #131a41, 0 0 0 11px rgba(61,220,132,0); }
    }
    .stage-node.next .stage-circle { background: linear-gradient(160deg, #35c26f, #14894b); border-color: #a4f7c6; }
    .stage-circle .st-kind-ic { line-height: 0; margin-top: 2px; opacity: 0.9; }
    .stage-circle .st-kind-ic svg { width: 13px; height: 13px; }
    .node-crown { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); width: 30px; line-height: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
    .stage-node.boss .stage-circle { width: 74px; height: 74px; }
    .stage-node.boss { width: 88px; }
    .stage-node.boss .stage-circle svg.boss-mini { width: 46px; height: 46px; }
    .boss-mini-label { position: absolute; bottom: -2px; right: -4px; background: #131a41; border: 1.5px solid #6a7ce0; color: #cdd6ff; font-size: 0.56rem; font-weight: 900; border-radius: 8px; padding: 1px 6px; }
    .stage-node.locked .boss-mini-label { border-color: #333d76; color: #55609c; }
    .stage-stars { font-size: 0.74rem; letter-spacing: 1px; color: var(--gold); font-weight: 900; height: 15px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .stage-stars .off { color: #39406e; text-shadow: none; }
    .stage-kind { font-size: 0.6rem; font-weight: 900; padding: 2px 8px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
    .stage-kind svg { width: 10px; height: 10px; }
    .stage-kind.choice { background: rgba(139,92,246,0.18); color: #c9b4ff; border: 1px solid rgba(139,92,246,0.5); }
    .stage-kind.input  { background: rgba(61,220,132,0.14); color: #8ef0b6; border: 1px solid rgba(61,220,132,0.45); }
    .stage-kind.spot   { background: rgba(255,107,157,0.14); color: #ffa9c6; border: 1px solid rgba(255,107,157,0.45); }
    .stage-kind.bosskind { background: rgba(255,93,93,0.16); color: #ffb1b1; border: 1px solid rgba(255,93,93,0.5); }
    .stage-node.locked .stage-kind { background: rgba(255,255,255,0.05); color: #55609c; border-color: #333d76; }

    footer { position: relative; z-index: 1; text-align: center; padding: 22px; color: #5b64a0; font-size: 0.78rem; font-weight: 700; }

    /* ═══════════ ステージ画面 ═══════════ */
    #stage-screen { display: none; flex-direction: column; min-height: 100vh; position: relative; z-index: 1; }
    .quiz-header {
      position: relative; z-index: 10;
      background: rgba(13,19,48,0.92); border-bottom: 2px solid var(--panel-line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; gap: 8px; backdrop-filter: blur(6px);
    }
    .back-btn {
      background: #232a52; border: 2px solid var(--panel-line);
      color: var(--text-hi); font-family: inherit; font-size: 0.82rem; font-weight: 800;
      padding: 8px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap;
      box-shadow: 0 3px 0 #10152f; transition: transform 0.12s;
    }
    .back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #10152f; }
    .quiz-header-title { flex: 1; text-align: center; font-weight: 900; font-size: 0.92rem; color: var(--gold); padding: 0 4px; min-width: 0; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .timer-display {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(65,214,227,0.12); border: 1.5px solid rgba(65,214,227,0.4);
      border-radius: 99px; padding: 5px 12px;
      font-size: 0.9rem; font-weight: 900; color: var(--cyan);
      font-variant-numeric: tabular-nums; letter-spacing: 0.04em; white-space: nowrap;
    }
    .timer-display svg { width: 13px; height: 13px; }
    .header-count { color: var(--text-mid); font-size: 0.85rem; font-weight: 900; white-space: nowrap; }
    .progress-wrap { position: relative; z-index: 10; height: 7px; background: #10152f; }
    .progress-fill { height: 100%; border-radius: 0 4px 4px 0; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); box-shadow: 0 0 10px rgba(255,201,60,0.7); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

    .quiz-main { flex: 1; position: relative; z-index: 1; max-width: 660px; width: 100%; margin: 0 auto; padding: 24px 16px 60px; }
    body.dock-open .quiz-main { padding-bottom: 330px; }
    .quiz-card {
      background: var(--paper); border-radius: 22px; padding: 28px 26px; color: var(--ink);
      border: 3px solid #2b2a55; box-shadow: 0 8px 0 rgba(10,14,38,0.85), 0 20px 40px rgba(0,0,0,0.45);
      animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 480px) { .quiz-card { padding: 22px 16px; } }

    /* ── ステージ開始カード ── */
    .intro-head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
    .intro-art { width: 84px; height: 84px; flex-shrink: 0; border-radius: 20px; background: radial-gradient(circle at 50% 30%, #26306b, #131a41); border: 2.5px solid var(--panel-line); display: flex; align-items: center; justify-content: center; }
    .intro-art svg { width: 66px; height: 66px; }
    .intro-kind { display: inline-block; font-size: 0.74rem; font-weight: 900; padding: 4px 12px; border-radius: 99px; margin-bottom: 8px; }
    .intro-kind.choice { background: #efe6ff; color: #6d28d9; }
    .intro-kind.input  { background: #dcfce7; color: #15803d; }
    .intro-kind.spot   { background: #ffe4ee; color: #be185d; }
    .intro-title { font-size: 1.35rem; font-weight: 900; }
    .intro-unit  { color: var(--ink-soft); font-size: 0.88rem; margin-top: 2px; font-weight: 700; }
    .intro-boss-name { font-size: 0.78rem; color: #b45309; font-weight: 900; margin-top: 4px; }
    .intro-conds { display: flex; flex-direction: column; gap: 8px; margin: 18px 0 22px; }
    .intro-cond { display: flex; align-items: center; gap: 10px; background: #f6f7ff; border: 2px solid #e3e6fb; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; font-weight: 800; }
    .intro-cond .ic-star { color: var(--gold-deep); font-weight: 900; white-space: nowrap; letter-spacing: 1px; }
    .start-stage-btn {
      width: 100%; padding: 17px; border-radius: 16px; border: none; cursor: pointer;
      font-family: inherit; font-size: 1.1rem; font-weight: 900; letter-spacing: 0.08em;
      background: linear-gradient(160deg, #ffd968, var(--gold-deep)); color: #4b3200;
      box-shadow: 0 5px 0 #7a5410, 0 10px 24px rgba(255,201,60,0.35); transition: transform 0.12s, box-shadow 0.12s;
    }
    .start-stage-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a5410; }

    /* ── 問題表示 ── */
    .q-label { font-size: 0.7rem; font-weight: 900; letter-spacing: 0.12em; color: #7c3aed; text-transform: uppercase; margin-bottom: 12px; }
    .q-text  { font-size: clamp(1.35rem, 4vw, 1.9rem); font-weight: 900; color: var(--ink); line-height: 1.5; margin-bottom: 24px; }

    .choices { display: flex; flex-direction: column; gap: 11px; }
    .choice-btn {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px;
      width: 100%; text-align: left; font-family: inherit; font-size: 1rem; font-weight: 800;
      cursor: pointer; background: #f6f7ff; border: 2.5px solid #dfe3fa; color: var(--ink);
      box-shadow: 0 3px 0 #d3d8f5;
      opacity: 0; animation: choiceIn 0.3s ease-out forwards;
      transition: transform 0.13s, border-color 0.16s, background 0.16s, box-shadow 0.16s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--purple); background: #f3edff; transform: translateY(-2px); box-shadow: 0 5px 0 #d3d8f5; }
    .choice-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #d3d8f5; }
    @keyframes choiceIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .choice-label { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 900; background: #e6e0ff; color: #6d28d9; transition: background 0.18s, color 0.18s; }
    .choice-btn.correct { background: #e3fcee; border-color: #22c55e; box-shadow: 0 3px 0 #b9ecd0, 0 0 0 3px rgba(34,197,94,0.2); animation: correctPop 0.35s ease-out; }
    .choice-btn.correct .choice-label { background: #22c55e; color: #fff; }
    @keyframes correctPop { 0% { transform: scale(0.97); } 55% { transform: scale(1.04); } 100% { transform: scale(1); } }
    .choice-btn.wrong { background: #ffecec; border-color: var(--red); box-shadow: 0 3px 0 #f5c9c9; animation: shake 0.38s ease-out; }
    .choice-btn.wrong .choice-label { background: var(--red); color: #fff; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
    .choice-btn.dimmed { opacity: 0.35; }

    /* ── 間違い探し ── */
    .spot-badge { display: inline-flex; align-items: center; gap: 5px; background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; font-size: 0.7rem; font-weight: 900; padding: 4px 12px; border-radius: 99px; margin-bottom: 10px; letter-spacing: 0.05em; }
    .spot-badge svg { width: 11px; height: 11px; }
    .spot-prompt { font-size: 0.95rem; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.6; font-weight: 700; }
    .spot-process { background: #fff5f9; border: 2.5px solid #ffd3e5; border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
    .spot-line { font-size: 1.05rem; font-weight: 800; color: var(--ink); padding: 4px 0; line-height: 1.7; }
    .spot-line .line-num { color: var(--pink); font-weight: 900; margin-right: 8px; }
    .spot-choice { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: 12px; background: #f6f7ff; border: 2.5px solid #dfe3fa; box-shadow: 0 3px 0 #d3d8f5; cursor: pointer; font-family: inherit; font-size: 0.95rem; font-weight: 800; color: var(--ink); width: 100%; text-align: left; opacity: 0; animation: choiceIn 0.3s ease-out forwards; transition: transform 0.13s, border-color 0.16s, background 0.16s; }
    .spot-choice:hover:not(:disabled) { background: #fff0f6; border-color: var(--pink); transform: translateY(-2px); }
    .spot-choice:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #d3d8f5; }
    .spot-choice .sc-label { width: 32px; height: 32px; border-radius: 8px; background: #ffe0ec; color: #be185d; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .spot-choice.correct { background: #e3fcee; border-color: #22c55e; }
    .spot-choice.correct .sc-label { background: #22c55e; color: #fff; }
    .spot-choice.wrong { background: #ffecec; border-color: var(--red); animation: shake 0.38s ease-out; }
    .spot-choice.wrong .sc-label { background: var(--red); color: #fff; }
    .spot-choice.dimmed { opacity: 0.35; }

    /* ── 値・式 入力ステージ ── */
    .input-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .ans-input {
      flex: 1; min-width: 190px; max-width: 320px;
      padding: 13px 16px; border-radius: 14px; border: 2.5px solid #c9cff5;
      font-size: 1.3rem; font-weight: 700; color: var(--ink);
      font-family: 'Times New Roman', 'Georgia', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-style: italic;
      background: #f6f7ff; outline: none; transition: border-color 0.16s, box-shadow 0.16s;
      caret-color: var(--green-deep);
    }
    .ans-input.field-on, .ans-input:focus { border-color: var(--green-deep); box-shadow: 0 0 0 3px rgba(22,163,74,0.18); background: #fff; }
    .ans-input:disabled { background: #eef0f7; color: #94a3b8; }
    .ans-input.wrong-flash { animation: shake 0.38s ease-out; border-color: var(--red); }
    .input-mode-chip { font-size: 0.7rem; font-weight: 900; color: #15803d; background: #dcfce7; border: 1.5px solid #86efac; border-radius: 99px; padding: 4px 10px; white-space: nowrap; }

    /* 分数の上下ボックス入力 */
    .frac-widget { display: none; align-items: center; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .frac-widget.show { display: flex; }
    .fwrap { display: flex; flex-direction: column; align-items: center; }
    .fbox {
      width: 116px; height: 58px; text-align: center;
      font-size: 1.5rem; font-weight: 700; color: var(--ink);
      font-family: 'Times New Roman', 'Georgia', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      border: 2.5px dashed #b9c0ef; border-radius: 12px; background: #f6f7ff; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      caret-color: var(--green-deep);
    }
    .fbox.field-on, .fbox:focus { border-style: solid; border-color: var(--green-deep); box-shadow: 0 0 0 3px rgba(22,163,74,0.18); background: #fff; }
    .fbox:disabled { background: #eef0f7; color: #94a3b8; }
    .fbar { width: 136px; height: 4px; background: var(--ink); border-radius: 2px; margin: 9px 0; }
    .fside-labels { display: flex; flex-direction: column; justify-content: space-between; height: 128px; padding: 6px 0; }
    .fside { font-size: 0.68rem; font-weight: 900; color: var(--ink-soft); background: #eef0fb; border-radius: 8px; padding: 3px 9px; }
    .frac-widget.wrong-flash .fbox { animation: shake 0.38s ease-out; border-color: var(--red); }

    /* 式のライブプレビュー */
    .preview-row { display: none; margin: 2px 0 12px; }
    .preview-row.show { display: block; }
    .pv-label { font-size: 0.66rem; font-weight: 900; color: #7c3aed; letter-spacing: 0.1em; margin-bottom: 4px; }
    .pv-body {
      min-height: 52px; display: flex; align-items: center;
      border: 2.5px dashed #d9cdfb; border-radius: 12px; background: #faf7ff;
      padding: 8px 16px; font-size: 1.45rem; font-weight: 800; color: var(--ink); line-height: 1.4;
      overflow-x: auto;
    }
    .pv-empty { font-size: 0.78rem; color: #b3a4d6; font-weight: 800; font-style: normal; }

    .input-guide { font-size: 0.74rem; color: #9ca3af; margin-bottom: 6px; line-height: 1.6; font-weight: 700; }

    .giveup-btn {
      display: none; margin-top: 12px; padding: 12px 18px; border-radius: 13px; cursor: pointer;
      font-family: inherit; font-size: 0.86rem; font-weight: 900;
      background: #fff; color: #b45309; border: 2.5px solid #fcd34d; box-shadow: 0 3px 0 #f1dc9d; transition: transform 0.12s;
    }
    .giveup-btn.show { display: inline-block; animation: fadeIn 0.28s ease-out; }
    .giveup-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #f1dc9d; }
    .verdict { display: none; margin-top: 14px; font-size: 1.15rem; font-weight: 900; }
    .verdict.ok { display: block; color: var(--green-deep); animation: correctPop 0.35s ease-out; }
    .verdict.ng { display: block; color: #dc2626; }
    .reveal-answer { margin-top: 8px; font-size: 1.05rem; font-weight: 800; color: var(--ink); }
    .reveal-answer b { color: var(--green-deep); }

    .hint-box { display: none; margin-top: 16px; padding: 13px 15px; border-radius: 12px; background: #fffbeb; border: 2px solid #fcd34d; }
    .hint-box.show { display: block; animation: fadeIn 0.28s ease-out; }
    .hint-label { font-size: 0.7rem; font-weight: 900; color: #d97706; margin-bottom: 4px; letter-spacing: 0.06em; }
    .hint-text  { font-size: 0.9rem; color: #92400e; font-weight: 700; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .next-btn {
      display: none; margin-top: 20px; width: 100%; padding: 15px; border-radius: 15px; border: none; cursor: pointer;
      font-family: inherit; font-size: 1rem; font-weight: 900;
      background: linear-gradient(160deg, #8f7bf7, #6d4fe0); color: #fff;
      box-shadow: 0 4px 0 #4630a8, 0 10px 20px rgba(109,79,224,0.35); transition: transform 0.12s, box-shadow 0.12s;
      animation: fadeIn 0.3s ease-out;
    }
    .next-btn.show { display: block; }
    .next-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4630a8; }

    /* メモボタン（memo-board.js 用のトーン） */
    .tool-btn {
      padding: 9px 20px; border-radius: 99px;
      font-weight: 800; font-size: 0.85rem; font-family: inherit;
      border: 2px solid #c9cff5; background: #fff; color: #4f46e5;
      cursor: pointer; transition: all 0.18s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tool-btn:hover { border-color: #4f46e5; background: #f3f1ff; }

    /* ── ステージクリア ポップアップ ── */
    #clear-pop {
      position: fixed; inset: 0; z-index: 300; display: none;
      align-items: center; justify-content: center;
      background: rgba(7,11,33,0.78); backdrop-filter: blur(3px);
    }
    #clear-pop.show { display: flex; }
    .pop-card { text-align: center; animation: popZoom 0.55s cubic-bezier(0.2,1.4,0.4,1) both; }
    @keyframes popZoom { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .pop-banner {
      font-size: clamp(2rem, 9vw, 3.4rem); font-weight: 900; letter-spacing: 0.06em;
      background: linear-gradient(180deg, #fff3c4 20%, var(--gold) 60%, var(--gold-deep));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 6px 30px rgba(255,201,60,0.4);
    }
    .pop-stars { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
    .pop-stars span { font-size: 3rem; color: #39406e; }
    .pop-stars span.on { color: var(--gold); animation: starPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; text-shadow: 0 4px 20px rgba(255,201,60,0.8); }
    .pop-nyake { width: 90px; margin: 14px auto 0; animation: bob 1.6s ease-in-out infinite; }

    /* ── ステージ結果 ── */
    .result-card {
      display: none; background: var(--paper); border-radius: 22px; padding: 36px 26px; color: var(--ink);
      border: 3px solid #2b2a55; box-shadow: 0 8px 0 rgba(10,14,38,0.85), 0 20px 40px rgba(0,0,0,0.45);
      text-align: center; animation: zoomIn 0.45s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.88); } to { opacity: 1; transform: scale(1); } }
    .result-stars { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .rstar { font-size: 3.2rem; color: #e2e4f2; transition: transform 0.2s; }
    .rstar.earned { color: var(--gold-deep); animation: starPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; text-shadow: 0 4px 14px rgba(245,165,36,0.5); }
    @keyframes starPop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    .result-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
    .result-msg { color: var(--ink-soft); margin-bottom: 20px; font-size: 0.92rem; font-weight: 700; }
    .result-nyake-row { display: inline-flex; align-items: center; gap: 10px; background: #f6f7ff; border: 2px solid #e3e6fb; border-radius: 16px; padding: 8px 16px 8px 8px; margin-bottom: 22px; }
    .result-nyake-row .rn-face { width: 46px; flex-shrink: 0; }
    .result-nyake-row .rn-say { font-size: 0.88rem; font-weight: 800; color: #37356b; text-align: left; }
    .score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
    .score-box  { border-radius: 16px; padding: 15px 8px; border: 2px solid #e3e6fb; background: #f6f7ff; }
    .score-num  { font-size: 1.7rem; font-weight: 900; }
    .score-num.pct  { color: var(--green-deep); }
    .score-num.ok   { color: #22c55e; }
    .score-num.tm   { color: #0284c7; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
    .score-label    { font-size: 0.7rem; color: #9ca3af; margin-top: 4px; font-weight: 800; }
    .result-btns { display: flex; flex-direction: column; gap: 10px; }
    @media(min-width:480px){ .result-btns { flex-direction: row; } }
    .btn-next-stage { flex: 1.4; padding: 15px; border-radius: 15px; border: none; cursor: pointer; font-family: inherit; font-size: 0.95rem; font-weight: 900; background: linear-gradient(160deg, #ffd968, var(--gold-deep)); color: #4b3200; box-shadow: 0 4px 0 #7a5410; transition: transform 0.12s, box-shadow 0.12s; }
    .btn-retry { flex: 1; padding: 15px; border-radius: 15px; border: none; cursor: pointer; font-family: inherit; font-size: 0.95rem; font-weight: 900; background: linear-gradient(160deg, #8f7bf7, #6d4fe0); color: #fff; box-shadow: 0 4px 0 #4630a8; transition: transform 0.12s, box-shadow 0.12s; }
    .btn-map { flex: 1; padding: 15px; border-radius: 15px; cursor: pointer; font-family: inherit; font-size: 0.95rem; font-weight: 900; background: #fff; color: #37356b; border: 2.5px solid #c9cff5; box-shadow: 0 4px 0 #d3d8f5; transition: transform 0.12s, box-shadow 0.12s; }
    .btn-next-stage:active, .btn-retry:active, .btn-map:active { transform: translateY(3px); box-shadow: none; }

    /* ── 画面下 固定入力パッド（ドック） ── */
    #pad-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 150; display: none; }
    body.dock-open #pad-dock { display: block; }
    .dock-inner {
      max-width: 560px; margin: 0 auto;
      background: rgba(13,18,48,0.97); border: 2px solid var(--panel-line); border-bottom: none;
      border-radius: 20px 20px 0 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 34px rgba(0,0,0,0.55); backdrop-filter: blur(8px);
    }
    .dock-keys { display: grid; gap: 6px; margin-bottom: 8px; }
    .dock-keys.cols4 { grid-template-columns: repeat(4, 1fr); }
    .dock-keys.cols7 { grid-template-columns: repeat(7, 1fr); }
    .dkey {
      height: 46px; border-radius: 11px; border: 1px solid #38468e;
      background: #1d2757; color: var(--text-hi);
      font-size: 1.12rem; font-weight: 800; font-family: inherit; cursor: pointer;
      touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      box-shadow: 0 3px 0 #0b1130; transition: transform 0.08s, box-shadow 0.08s;
      display: flex; align-items: center; justify-content: center; padding: 0 2px;
    }
    .dkey:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b1130; background: #27336e; }
    .dkey.fn { background: #292058; color: #cdb9ff; border-color: #4d3f96; box-shadow: 0 3px 0 #150f33; }
    .dkey.fn:active { box-shadow: 0 1px 0 #150f33; }
    .dkey.bs { color: #ff9a9a; }
    .dkey.span2 { grid-column: span 2; }
    .dkey.span4 { grid-column: span 4; }
    .dkey svg { display: block; }
    .dkey .mnv { font-family: 'Times New Roman', 'Georgia', serif; font-style: italic; }
    .dock-check {
      width: 100%; height: 56px; border: none; border-radius: 15px; cursor: pointer;
      font-family: inherit; font-size: 1.12rem; font-weight: 900; letter-spacing: 0.06em;
      background: linear-gradient(160deg, #4ee694, var(--green-deep)); color: #06240f;
      box-shadow: 0 4px 0 #0e6b34; transition: transform 0.1s, box-shadow 0.1s;
      touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .dock-check:active { transform: translateY(3px); box-shadow: 0 1px 0 #0e6b34; }
    .dock-check.next-mode { background: linear-gradient(160deg, #ffd968, var(--gold-deep)); color: #4b3200; box-shadow: 0 4px 0 #7a5410; }
    .dock-check.next-mode:active { box-shadow: 0 1px 0 #7a5410; }

    /* ── トースト ── */
    #park-toast {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-12px);
      background: linear-gradient(135deg, #2b3a97, #4759c7);
      color: #fff; border: 1.5px solid #6a7ce0; border-radius: 99px; padding: 10px 26px;
      font-size: 0.92rem; font-weight: 900;
      box-shadow: 0 8px 26px rgba(0,0,0,0.5);
      z-index: 400; opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
    }
    #park-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 420px) {
      .park-hero { padding: 26px 16px 8px; gap: 12px; }
      .hero-nyake { width: 76px; }
      .stage-node { width: 70px; }
      .stage-circle { width: 55px; height: 55px; font-size: 0.88rem; }
      .stage-node.boss .stage-circle { width: 68px; height: 68px; }
      .stage-wrap:not(:last-child)::after { width: 14px; }
      .fbox { width: 100px; }
      .fbar { width: 118px; }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>
  <div class="night-bg" id="night-bg"></div>
  <div class="park-skyline" aria-hidden="true">
    <svg viewBox="0 0 900 190" preserveAspectRatio="xMidYMax slice">
      <!-- 観覧車 -->
      <g stroke="#2a3670" fill="none" stroke-width="3">
        <circle cx="720" cy="88" r="66"/>
        <circle cx="720" cy="88" r="8" fill="#2a3670"/>
        <path d="M720 22 V154 M654 88 H786 M673 41 L767 135 M767 41 L673 135"/>
        <path d="M700 190 L720 96 L740 190"/>
      </g>
      <g fill="#324086">
        <circle cx="720" cy="22" r="7"/><circle cx="786" cy="88" r="7"/><circle cx="720" cy="154" r="7"/><circle cx="654" cy="88" r="7"/>
        <circle cx="767" cy="41" r="7"/><circle cx="767" cy="135" r="7"/><circle cx="673" cy="41" r="7"/><circle cx="673" cy="135" r="7"/>
      </g>
      <!-- テント -->
      <g>
        <path d="M60 190 L75 128 Q110 112 145 128 L160 190 Z" fill="#232c63"/>
        <path d="M70 132 Q110 100 150 132 L110 74 Z" fill="#2c3778"/>
        <path d="M110 74 L110 58 L128 64 L110 70 Z" fill="#3a478f"/>
      </g>
      <!-- 丘 -->
      <path d="M0 190 Q140 148 300 172 Q460 196 620 168 Q760 146 900 176 L900 190 Z" fill="#141b45"/>
    </svg>
  </div>
  <div id="park-toast"></div>

  <!-- ══════════════ ワールドマップ ══════════════ -->
  <div id="map-screen">
    <header class="park-hero">
      <div class="hero-nyake" id="hero-nyake" aria-hidden="true"></div>
      <div>
        <h1>数学パーク</h1>
        <p class="hero-sub">よるの ゆうえんちで ステージを クリアして 道を ひらこう</p>
      </div>
    </header>
    <div class="hero-marquee" aria-hidden="true"></div>
    <div class="nyake-line">
      <div class="nyake-bubble" id="nyake-say">ようこそ、数学パークへ！ステージを クリアすると つぎの道が ひらくにゃ</div>
    </div>
    <div class="park-summary">
      <div class="psum"><div class="psum-num" id="sum-stars">★0</div><div class="psum-label">あつめた星</div></div>
      <div class="psum"><div class="psum-num" id="sum-cleared">0/0</div><div class="psum-label">クリアしたステージ</div></div>
      <div class="psum"><div class="psum-num" id="sum-worlds">0/0</div><div class="psum-label">たおしたボス</div></div>
    </div>
    <div class="total-bar-wrap">
      <div class="total-bar"><i id="total-bar-fill" style="width:0%"></i></div>
      <div class="total-bar-label" id="total-bar-label"></div>
    </div>
    <div id="worlds-container"></div>
    <footer>数学パーク — あたらしいワールドは じゅんびちゅう</footer>
  </div>

  <!-- ══════════════ ステージ画面 ══════════════ -->
  <div id="stage-screen">
    <header class="quiz-header">
      <button class="back-btn" onclick="backToMap()">← マップ</button>
      <div class="quiz-header-title" id="stage-title"></div>
      <div class="header-right">
        <div class="timer-display" id="timer-display" style="display:none;"></div>
        <div class="header-count" id="header-count"></div>
      </div>
    </header>
    <div class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <main class="quiz-main">

      <!-- ステージ開始カード -->
      <div class="quiz-card" id="intro-card" style="display:none;">
        <div class="intro-head">
          <div class="intro-art" id="intro-art"></div>
          <div>
            <span class="intro-kind" id="intro-kind"></span>
            <div class="intro-title" id="intro-stage-name"></div>
            <div class="intro-unit" id="intro-unit-name"></div>
            <div class="intro-boss-name" id="intro-boss-name"></div>
          </div>
        </div>
        <div class="intro-conds" id="intro-conds"></div>
        <button class="start-stage-btn" onclick="startStage()">スタート！</button>
      </div>

      <!-- 問題カード -->
      <div class="quiz-card" id="quiz-card" style="display:none;">
        <div class="q-label" id="q-label"></div>
        <p class="q-text" id="q-text"></p>

        <!-- 4択・間違い探し -->
        <div class="choices" id="choices"></div>

        <!-- 値・式入力 -->
        <div id="input-area" style="display:none;">
          <div class="input-row" id="plain-row">
            <input class="ans-input" id="ans-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <span class="input-mode-chip" id="input-mode-chip"></span>
          </div>
          <div class="frac-widget" id="frac-widget">
            <div class="fwrap">
              <input class="fbox" id="frac-num" autocomplete="off" spellcheck="false" aria-label="分子">
              <div class="fbar" aria-hidden="true"></div>
              <input class="fbox" id="frac-den" autocomplete="off" spellcheck="false" aria-label="分母">
            </div>
            <div class="fside-labels" aria-hidden="true">
              <span class="fside">うえ＝分子</span>
              <span class="fside">した＝分母</span>
            </div>
          </div>
          <div class="preview-row" id="preview-row">
            <div class="pv-label">じっさいの見た目（プレビュー）</div>
            <div class="pv-body" id="expr-preview"></div>
          </div>
          <div class="input-guide" id="input-guide"></div>
          <button class="giveup-btn" id="giveup-btn" onclick="giveUp()">答えを見る</button>
          <div class="verdict" id="verdict"></div>
          <div class="reveal-answer" id="reveal-answer" style="display:none;"></div>
        </div>

        <div class="hint-box" id="hint-box">
          <div class="hint-label">ヒント</div>
          <div class="hint-text" id="hint-text"></div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()"></button>

        <!-- 手書き計算メモ（判定には使わない・考えるための余白） -->
        <div style="margin-top:20px; border-top:2px dotted #d9ddf5; padding-top:14px;">
          <button class="tool-btn" id="memo-toggle" type="button">✏️ 計算メモ（手書き）</button>
          <div id="memo-box"></div>
        </div>
      </div>

      <!-- 結果カード -->
      <div class="result-card" id="result-card">
        <div class="result-stars">
          <span class="rstar" id="rstar1">★</span>
          <span class="rstar" id="rstar2">★</span>
          <span class="rstar" id="rstar3">★</span>
