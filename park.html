    /* 小物SVG */
    const SVG_LOCK = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><rect x="4.5" y="10" width="15" height="10.5" rx="3" fill="currentColor"/></svg>';
    const SVG_CROWN = '<svg viewBox="0 0 32 22" width="100%" aria-hidden="true"><path d="M4 18 L2.5 5 L10.5 11.5 L16 2.5 L21.5 11.5 L29.5 5 L28 18 Z" fill="#ffc93c" stroke="#b97e0a" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="12.5" r="2" fill="#ff6b9d"/></svg>';
    const SVG_FLAG = '<svg viewBox="0 0 18 18" width="15" height="15" aria-hidden="true"><path d="M4 17 V2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M5.5 2.5 L14.5 5.5 L5.5 8.5 Z" fill="currentColor"/></svg>';
    const SVG_CLOCK = '<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M10 6 V10 L13 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
    const FRAC_ICON = '<svg viewBox="0 0 16 24" width="14" height="21" aria-hidden="true"><rect x="3" y="2" width="10" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><line x1="1" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="3" y="14.5" width="10" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>';
    const SVG_SWAP = '<svg viewBox="0 0 20 24" width="15" height="18" aria-hidden="true"><path d="M6 4 V16 M6 16 L2.8 12.5 M6 16 L9.2 12.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 20 V8 M14 8 L10.8 11.5 M14 8 L17.2 11.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const KIND_SVG = {
      choice: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="1.5" y="1.5" width="7.5" height="7.5" rx="2"/><rect x="11" y="1.5" width="7.5" height="7.5" rx="2" opacity="0.55"/><rect x="1.5" y="11" width="7.5" height="7.5" rx="2" opacity="0.55"/><rect x="11" y="11" width="7.5" height="7.5" rx="2" opacity="0.55"/></svg>',
      input:  '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M2.5 17.5 L4 12.8 L13.6 3.2 A2.1 2.1 0 0 1 16.8 6.4 L7.2 16 Z"/></svg>',
      spot:   '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.6"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>',
    };

    /* ════════════════ 解答の正規化・判定（まなびポータル Code.js から移植） ════════════════ */

    /* 全角→半角の正規化。NFKCで ０-９・ａ-ｚ・＋－＝．／（） 等を半角化し、U+2212(−) も - に寄せる。
       ※NFKC は ² → 2 / ³ → 3 にも畳むので、比較の直前に両辺へかける（入力欄の表示には使わない） */
    function z2h(s) {
      s = String(s == null ? '' : s);
      try { s = s.normalize('NFKC'); } catch (e) {}
      return s.replace(/−/g, '-');
    }
    /* データの分数記法 [[a/b]] → a/b （判定用） */
    function stripFracMark(s) {
      return String(s).replace(/\[\[([^\[\]]+?)\/([^\]]+?)\]\]/g, '$1/$2');
    }
    /* 数値解答を数に変換。「1/2」「-3/4」の分数形も計算（1/2 と 0.5 は同じ扱い） */
    function numVal(s) {
      s = z2h(s).replace(/\s/g, '');
      const m = s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);
      if (m) return Number(m[1]) / Number(m[2]);
      return Number(s);
    }
    /* 式解答の正規化（比較用）：全角→半角・小文字化・空白除去・^除去（x^2 と x² を同一視） */
    function normExpr(s) {
      return z2h(stripFracMark(s)).toLowerCase().replace(/[\s　]/g, '').replace(/\^/g, '').replace(/\(\(|\)\)/g, '');
    }
    /* 入力解答の正誤判定 */
    function judgeInput(mode, correct, given) {
      if (mode === 'number') {
        const av = numVal(stripFracMark(correct)), gv = numVal(given);
        return isFinite(av) && isFinite(gv) && Math.abs(av - gv) < 1e-9;
      }
      return normExpr(correct) === normExpr(given);
    }

    /* 解答の形式分類：number（数値・分数・小数）／ expr（x,y,a,b の式）／ null（変換不可→4択のまま） */
    function classifyAnswer(correct) {
      const s = z2h(stripFracMark(correct)).replace(/\s/g, '');
      if (/^[+-]?\d+(\.\d+)?(\/[+-]?\d+(\.\d+)?)?$/.test(s)) return 'number';
      if (/^[0-9xyab+\-×÷=().²³√\/]+$/i.test(s) && /[xyab]/i.test(s) && s.length <= 18) return 'expr';
      return null;
    }

    /* 正解が「純粋な分数（a/b・-a/b）」か（UI出し分け用。判定ロジックには影響しない） */
    function isPureFraction(correct) {
      return /^-?\d+\/\d+$/.test(z2h(stripFracMark(correct)).replace(/\s/g, ''));
    }

    /* ════════════════ ワールド・ステージの生成 ════════════════ */

    const GRADES = ['中学1年', '中学2年', '中学3年'];
    const KIND_LABEL = { choice: '4たく', input: 'にゅうりょく', spot: 'まちがいさがし' };
    const PER_Q_MS   = { choice: 12000, input: 30000, spot: 40000 };

    function inputPoolOf(unit) {
      return unit.questions.filter(q => q.type !== 'spot' && classifyAnswer(q.correct));
    }

    function buildWorlds() {
      const worlds = [];
      for (const grade of GRADES) {
        const chapters = new Map();
        QUIZ_DATA.units.filter(u => u.grade === grade).forEach(u => {
          const key = u.chapterOrder + '|' + u.chapter;
          if (!chapters.has(key)) chapters.set(key, []);
          chapters.get(key).push(u);
        });
        const sortedKeys = [...chapters.keys()].sort((a, b) => parseInt(a) - parseInt(b));
        for (const key of sortedKeys) {
          const units = chapters.get(key).sort((a, b) => (a.order || 0) - (b.order || 0));
          const chapter = key.split('|')[1];
          const stages = [];
          let calcIdx = 0;
          for (const u of units) {
            const hasSpot = u.questions.some(q => q.type === 'spot');
            if (hasSpot) {
              const pool = u.questions.filter(q => q.type === 'spot');
              stages.push({ id: u.id + '__s', kind: 'spot', unit: u, n: Math.min(pool.length, 5) });
              continue;
            }
            const inputPool = inputPoolOf(u);
            const capable = inputPool.length >= 8;
            if (units.length <= 3) {
              // 小さいワールド：同じ単元を「4択 → 入力」の2ステージに
              stages.push({ id: u.id + '__c', kind: 'choice', unit: u, n: Math.min(u.quizCount || 10, 10) });
              if (capable) stages.push({ id: u.id + '__i', kind: 'input', unit: u, n: 5 });
            } else {
              // 大きいワールド（正負の数）：単元ごとに 4択／入力を交互に
              const kind = (calcIdx % 2 === 1 && capable) ? 'input' : 'choice';
              stages.push({
                id: u.id + (kind === 'input' ? '__i' : '__c'),
                kind, unit: u,
                n: kind === 'input' ? 5 : Math.min(u.quizCount || 10, 10)
              });
              calcIdx++;
            }
          }
          worlds.push({ grade, chapter, units, stages, icon: units[0].icon || '📘' });
        }
      }
      worlds.forEach((w, i) => {
        w.num = i + 1;
        w.stages.forEach((s, j) => { s.world = w; s.idx = j; s.label = `${w.num}-${j + 1}`; });
      });
      return worlds;
    }

    const WORLDS = buildWorlds();
    const ALL_STAGES = WORLDS.flatMap(w => w.stages);

    /* ════════════════ 進捗（localStorage・既存キーとは別系統） ════════════════ */

    const STARS_KEY = 'mq_park_stars';
    function loadStars() {
      try { return JSON.parse(localStorage.getItem(STARS_KEY) || '{}'); } catch (e) { return {}; }
    }
    function starsOf(stageId) { return loadStars()[stageId] || 0; }
    function saveStars(stageId, stars) {
      try {
        const all = loadStars();
        if ((all[stageId] || 0) >= stars) return false;
        all[stageId] = stars;
        localStorage.setItem(STARS_KEY, JSON.stringify(all));
        return true;
      } catch (e) { return false; }
    }

    function worldUnlocked(world) {
      const sameGrade = WORLDS.filter(w => w.grade === world.grade);
      const i = sameGrade.indexOf(world);
      if (i === 0) return true; // 各学年の最初のワールドは最初からオープン
      const prev = sameGrade[i - 1];
      const lastStage = prev.stages[prev.stages.length - 1];
      return starsOf(lastStage.id) >= 1;
    }
    function stageUnlocked(stage) {
      if (!worldUnlocked(stage.world)) return false;
      if (stage.idx === 0) return true;
      return starsOf(stage.world.stages[stage.idx - 1].id) >= 1;
    }
    function worldCleared(world) {
      return world.stages.every(s => starsOf(s.id) >= 1);
    }

    /* ════════════════ ワールドマップ描画 ════════════════ */

    function renderMap() {
      const container = document.getElementById('worlds-container');
      const all = loadStars();
      let totalStars = 0, clearedStages = 0, clearedWorlds = 0;
      let nextFound = false;
      let html = '';
      let currentGrade = '';

      for (const w of WORLDS) {
        if (w.grade !== currentGrade) {
          currentGrade = w.grade;
          html += `<div class="grade-heading">${SVG_FLAG} ${w.grade} エリア</div>`;
        }
        const unlockedW = worldUnlocked(w);
        const wStars = w.stages.reduce((s, st) => s + (all[st.id] || 0), 0);
        totalStars += wStars;
        if (worldCleared(w)) clearedWorlds++;
        const boss = bossOf(w.num);
        const wMax = w.stages.length * 3;

        html += `<section class="world-card${unlockedW ? '' : ' locked-world'}">
          <div class="world-head">
            <div class="world-boss">${boss.svg}</div>
            <div class="world-info">
              <div class="world-name">ワールド${w.num}　${w.chapter}</div>
              <div class="world-sub">${w.grade}・全${w.stages.length}ステージ／ボス：${boss.name}</div>
              <div class="world-bar"><i style="width:${wMax ? Math.round(wStars / wMax * 100) : 0}%"></i></div>
            </div>
            ${unlockedW
              ? `<div class="world-stars">★ ${wStars} / ${wMax}</div>`
              : `<div class="world-lock-note">${SVG_LOCK} 前のワールドの ボスをたおすと オープン</div>`}
          </div>
          <div class="stage-path">`;

        for (const st of w.stages) {
          const stars = all[st.id] || 0;
          if (stars >= 1) clearedStages++;
          const unlocked = stageUnlocked(st);
          const isNext = unlocked && stars === 0 && !nextFound;
          if (isNext) nextFound = true;
          const isBoss = st.idx === w.stages.length - 1;
          const cls = ['stage-node', stars >= 1 ? 'cleared' : '', unlocked ? '' : 'locked', isNext ? 'next' : '', isBoss ? 'boss' : ''].join(' ');
          const starTxt = unlocked
            ? `<span>${'★'.repeat(stars)}</span><span class="off">${'★'.repeat(Math.max(0, 3 - stars))}</span>`
            : '';
          const inner = isBoss
            ? `<span class="node-crown">${SVG_CROWN}</span>
               ${unlocked ? boss.svg.replace('<svg ', '<svg class="boss-mini" ') : `<span style="color:currentColor">${SVG_LOCK}</span>`}
               <span class="boss-mini-label">${st.label}</span>`
            : `<span>${unlocked ? st.label : SVG_LOCK}</span>
               <span class="st-kind-ic">${unlocked ? KIND_SVG[st.kind] : ''}</span>`;
          html += `<div class="stage-wrap${stars >= 1 ? ' done' : ''}">
            <button class="${cls}" ${unlocked ? `onclick="openStage('${st.id}')"` : 'disabled'} aria-label="ステージ${st.label}${isBoss ? '（ボス）' : ''}">
              ${isNext ? `<span class="node-nyake">${svgNyake(46)}</span>` : ''}
              <span class="stage-circle">${inner}</span>
              <span class="stage-stars">${starTxt}</span>
              <span class="stage-kind ${isBoss ? 'bosskind' : st.kind}">${isBoss ? 'BOSS' : KIND_SVG[st.kind] + KIND_LABEL[st.kind]}</span>
            </button>
          </div>`;
        }
        html += `</div></section>`;
      }
      container.innerHTML = html;

      document.getElementById('sum-stars').textContent = `★${totalStars}`;
      document.getElementById('sum-cleared').textContent = `${clearedStages}/${ALL_STAGES.length}`;
      document.getElementById('sum-worlds').textContent = `${clearedWorlds}/${WORLDS.length}`;
      const maxStars = ALL_STAGES.length * 3;
      document.getElementById('total-bar-fill').style.width = (maxStars ? Math.round(totalStars / maxStars * 100) : 0) + '%';
      document.getElementById('total-bar-label').textContent = `パーク制覇まで ★${totalStars} / ${maxStars}`;

      const say = document.getElementById('nyake-say');
      if (clearedStages === 0) say.textContent = 'ようこそ、数学パークへ！ステージを クリアすると つぎの道が ひらくにゃ';
      else if (clearedStages >= ALL_STAGES.length) say.textContent = '全ステージ制覇…！キミは もう 数学パークの マスターだにゃ！';
      else if (totalStars >= clearedStages * 3) say.textContent = `★${totalStars}こ、ぜんぶ ★3の パーフェクトだにゃ…！すごいにゃ！`;
      else say.textContent = `★${totalStars}こ あつめたにゃ！★3を ねらって もう一回 あそぶのも アリだにゃ`;
    }

    /* ════════════════ ステージ進行 ════════════════ */

    let stage = null, questions = [], current = 0, correctCount = 0;
    let answered = false, hadMistake = false, wrongTries = 0;
    let stageStartTs = 0, elapsedMs = 0, timerInterval = null;

    function openStage(stageId) {
      stage = ALL_STAGES.find(s => s.id === stageId);
      if (!stage) return;
      closeDock();
      document.getElementById('map-screen').style.display = 'none';
      document.getElementById('stage-screen').style.display = 'flex';
      document.getElementById('quiz-card').style.display = 'none';
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('intro-card').style.display = 'block';
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('header-count').textContent = '';
      document.getElementById('timer-display').style.display = 'none';
      document.getElementById('stage-title').textContent = `ステージ ${stage.label}`;

      const isBoss = stage.idx === stage.world.stages.length - 1;
      const boss = bossOf(stage.world.num);
      const kindEl = document.getElementById('intro-kind');
      kindEl.className = 'intro-kind ' + stage.kind;
      kindEl.textContent = { choice: '4たくステージ', input: 'にゅうりょくステージ（自分で答えを打ちこむ）', spot: 'まちがいさがしステージ' }[stage.kind];
      document.getElementById('intro-art').innerHTML = isBoss ? boss.svg : svgNyake(64);
      document.getElementById('intro-stage-name').textContent = (isBoss ? 'ボスステージ ' : 'ステージ ') + stage.label;
      document.getElementById('intro-unit-name').textContent = `${stage.unit.title}（全${stage.n}問）`;
      document.getElementById('intro-boss-name').textContent = isBoss ? `ボス「${boss.name}」が まちうけている…！` : '';
      const limit = formatTime(stage.n * PER_Q_MS[stage.kind]);
      const cur = starsOf(stage.id);
      document.getElementById('intro-conds').innerHTML =
        `<div class="intro-cond"><span class="ic-star">★</span><span>8割以上 正解で クリア（つぎのステージが ひらく）</span></div>` +
        `<div class="intro-cond"><span class="ic-star">★★</span><span>全問正解で ゲット</span></div>` +
        `<div class="intro-cond"><span class="ic-star">★★★</span><span>全問正解 ＆ タイム ${limit} 以内</span></div>` +
        (cur > 0 ? `<div class="intro-cond" style="background:#fffbeb;border-color:#fcd34d;"><span class="ic-star">★${cur}</span><span>いまの記録：${'★'.repeat(cur)}${'☆'.repeat(3-cur)}</span></div>` : '');
      window.scrollTo(0, 0);
    }

    function startStage() {
      if (stage.kind === 'spot') {
        questions = shuffle(stage.unit.questions.filter(q => q.type === 'spot')).slice(0, stage.n);
      } else if (stage.kind === 'input') {
        questions = shuffle(inputPoolOf(stage.unit)).slice(0, stage.n)
          .map(q => Object.assign({}, q, { inputMode: classifyAnswer(q.correct) }));
      } else {
        questions = shuffle(stage.unit.questions.filter(q => q.type !== 'spot')).slice(0, stage.n);
      }
      current = 0; correctCount = 0;
      document.getElementById('intro-card').style.display = 'none';
      document.getElementById('quiz-card').style.display = 'block';
      // タイマー開始
      stageStartTs = performance.now();
      const tEl = document.getElementById('timer-display');
      tEl.style.display = 'inline-flex';
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        elapsedMs = performance.now() - stageStartTs;
        tEl.innerHTML = SVG_CLOCK + ' ' + formatTime(elapsedMs);
      }, 100);
      showQuestion();
    }

    function showQuestion() {
      answered = false; hadMistake = false; wrongTries = 0;
      if (window.MathMemo) MathMemo.onQuestionChange(); // 問題を移動したら手書きメモをクリア
      const q = questions[current], total = questions.length;
      document.getElementById('header-count').textContent = `${current + 1} / ${total}`;
      document.getElementById('q-label').textContent = `ステージ ${stage.label} ・ 問題 ${current + 1}`;
      document.getElementById('progress-fill').style.width = `${current / total * 100}%`;

      const choicesEl = document.getElementById('choices');
      const inputArea = document.getElementById('input-area');
      document.getElementById('hint-box').classList.remove('show');
      const nb = document.getElementById('next-btn');
      nb.classList.remove('show');
      nb.textContent = current + 1 < total ? '次の問題へ →' : '結果を見る';

      if (stage.kind === 'spot') {
        inputArea.style.display = 'none';
        closeDock();
        document.getElementById('q-text').innerHTML =
          `<div class="spot-badge">${KIND_SVG.spot} 思考力問題（間違い探し）</div>` +
          `<div class="spot-prompt">${renderMath(q.prompt)}</div>` +
          `<div class="spot-process">` +
            q.process.map((line, i) => `<div class="spot-line"><span class="line-num">${i + 1}.</span>${renderMath(line)}</div>`).join('') +
          `</div>`;
        choicesEl.innerHTML = q.process.map((_, i) => {
          const lineNum = i + 1;
          return `<button class="spot-choice" id="c${i}" style="animation-delay:${i * 0.07}s" onclick="pickSpot(${lineNum},${q.correctLine},this)">
            <span class="sc-label">${lineNum}</span><span>${lineNum}行目が間違い</span>
          </button>`;
        }).join('');
      } else if (stage.kind === 'input') {
        choicesEl.innerHTML = '';
        inputArea.style.display = 'block';
        document.getElementById('q-text').innerHTML = renderMath(q.q);
        setupInput(q);
      } else {
        inputArea.style.display = 'none';
        closeDock();
        document.getElementById('q-text').innerHTML = renderMath(q.q);
        const sc = shuffle(q.choices);
        const ci = sc.indexOf(q.correct);
        choicesEl.innerHTML = sc.map((c, i) =>
          `<button class="choice-btn" id="c${i}" style="animation-delay:${i * 0.07}s" onclick="pick(${i},${ci},this)">
            <span class="choice-label">${LABELS[i]}</span><span>${renderMath(c)}</span>
          </button>`
        ).join('');
      }

      const card = document.getElementById('quiz-card');
      card.style.animation = 'none';
      requestAnimationFrame(() => { card.style.animation = 'slideIn 0.35s cubic-bezier(0.4,0,0.2,1)'; });
    }

    /* ── 4択 ── */
    function pick(idx, correctIdx, btn) {
      if (answered) return;
      if (idx === correctIdx) {
        answered = true;
        if (!hadMistake) correctCount++;
        document.querySelectorAll('.choice-btn').forEach((b, i) => {
          b.disabled = true;
          if (i === correctIdx) b.classList.add('correct');
          else b.classList.add('dimmed');
        });
        if (!hadMistake) { const r = btn.getBoundingClientRect(); launchConfetti(r.left + r.width / 2, r.top + r.height / 2); }
        document.getElementById('hint-box').classList.remove('show');
        setTimeout(() => document.getElementById('next-btn').classList.add('show'), 380);
      } else {
        hadMistake = true;
        btn.disabled = true;
        btn.classList.add('wrong');
        const q = questions[current];
        if (q.hint) { document.getElementById('hint-text').innerHTML = renderMath(q.hint); document.getElementById('hint-box').classList.add('show'); }
      }
    }

    /* ── 間違い探し ── */
    function pickSpot(pickedLine, correctLine, btn) {
      if (answered) return;
      if (pickedLine === correctLine) {
        answered = true;
        if (!hadMistake) correctCount++;
        document.querySelectorAll('.spot-choice').forEach((b, i) => {
          b.disabled = true;
          if (i + 1 === correctLine) b.classList.add('correct');
          else b.classList.add('dimmed');
        });
        if (!hadMistake) { const r = btn.getBoundingClientRect(); launchConfetti(r.left + r.width / 2, r.top + r.height / 2); }
        document.getElementById('hint-box').classList.remove('show');
        setTimeout(() => document.getElementById('next-btn').classList.add('show'), 380);
      } else {
        hadMistake = true;
        btn.disabled = true;
        btn.classList.add('wrong');
        const q = questions[current];
        if (q.hint) { document.getElementById('hint-text').innerHTML = renderMath(q.hint); document.getElementById('hint-box').classList.add('show'); }
      }
    }

    /* ════════════════ 値・式入力（構造化入力＋画面下固定パッド） ════════════════
       ・正解が純粋な分数 → 分子／分母の上下ボックス（スラッシュを打たなくていい）
       ・正解が数値 → 1行入力＋数値パッド
       ・正解が式 → 1行入力＋教科書表記ライブプレビュー＋式パッド
       ・タッチ端末は readonly + inputmode=none でネイティブキーボードを出さない
       ・判定は従来どおり judgeInput()（分数は "分子/分母" に合成して渡す＝ロジック無変更） */

    const IS_TOUCH = (typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0) || ('ontouchstart' in window);

    /* キーボード入力もパッドにある文字しか通さないフィルタ（ユーザー決定）
       数値：0-9 . / -（全角はNFKCで半角へ）／ 式：0-9 x y a b + - × ÷ = . / ( ) ² ³ √ */
    function filterNum(s) {
      s = String(s == null ? '' : s);
      try { s = s.normalize('NFKC'); } catch (e) {}
      return s.replace(/−/g, '-').replace(/[^0-9.\/\-]/g, '');
    }
    function filterExpr(s) {
      s = String(s == null ? '' : s);
      // ²³ を保ったまま全角英数字・記号だけ半角化（NFKC を全体にかけると ² が 2 になって表示が崩れるため1文字ずつ）
      s = s.replace(/[０-９ａ-ｚＡ-Ｚ＋－＝．／（）ｘｙａｂ]/g, ch => ch.normalize('NFKC'));
      s = s.replace(/−/g, '-').replace(/[＊*]/g, '×');
      s = s.replace(/[A-Z]/g, ch => ch.toLowerCase());
      return s.replace(/[^0-9xyab+\-×÷=.\/()²³√ ]/g, '');
    }
    /* 分数ボックス用：分子は数字とマイナス（先頭のみ）、分母は数字だけ */
    function filterFracNum(s) {
      s = z2h(s).replace(/[^0-9\-]/g, '');
      return s.replace(/(?!^)-/g, '');
    }
    function filterFracDen(s) {
      return z2h(s).replace(/[^0-9]/g, '');
    }

    function ansInput() { return document.getElementById('ans-input'); }
    function fracNum() { return document.getElementById('frac-num'); }
    function fracDen() { return document.getElementById('frac-den'); }

    let activeField = null;   // パッド入力先（ans-input / frac-num / frac-den）
    let dockMode = '';        // 'check' | 'next'

    function setActiveField(el) {
      activeField = el;
      [ansInput(), fracNum(), fracDen()].forEach(f => f.classList.toggle('field-on', f === el));
    }

    /* パッドの組み立て */
    function dockKeyBtn(tok, label, cls, span) {
      const action = tok === 'BS' ? 'padBS()' : tok === 'SW' ? 'fracSwitch()' : `padPut('${tok}')`;
      return `<button type="button" class="dkey${cls ? ' ' + cls : ''}${span ? ' span' + span : ''}" onpointerdown="event.preventDefault()" onclick="${action}">${label || tok}</button>`;
    }
    function buildDock(uiMode) {
      const keysEl = document.getElementById('dock-keys');
      let keys = [];
      if (uiMode === 'fraction') {
        keysEl.className = 'dock-keys cols4';
        keys = [
          dockKeyBtn('7'), dockKeyBtn('8'), dockKeyBtn('9'), dockKeyBtn('BS', '⌫', 'bs'),
          dockKeyBtn('4'), dockKeyBtn('5'), dockKeyBtn('6'), dockKeyBtn('-', '−'),
          dockKeyBtn('1'), dockKeyBtn('2'), dockKeyBtn('3'), dockKeyBtn('SW', SVG_SWAP, 'fn'),
          dockKeyBtn('0', '0', '', 4),
        ];
      } else if (uiMode === 'number') {
        keysEl.className = 'dock-keys cols4';
        keys = [
          dockKeyBtn('7'), dockKeyBtn('8'), dockKeyBtn('9'), dockKeyBtn('BS', '⌫', 'bs'),
          dockKeyBtn('4'), dockKeyBtn('5'), dockKeyBtn('6'), dockKeyBtn('-', '−'),
          dockKeyBtn('1'), dockKeyBtn('2'), dockKeyBtn('3'), dockKeyBtn('/', FRAC_ICON, 'fn'),
          dockKeyBtn('0', '0', '', 2), dockKeyBtn('.', '.', '', 2),
        ];
      } else {
        keysEl.className = 'dock-keys cols7';
        keys = [
          dockKeyBtn('7'), dockKeyBtn('8'), dockKeyBtn('9'), dockKeyBtn('+'), dockKeyBtn('-', '−'), dockKeyBtn('×'), dockKeyBtn('÷'),
          dockKeyBtn('4'), dockKeyBtn('5'), dockKeyBtn('6'), dockKeyBtn('('), dockKeyBtn(')'), dockKeyBtn('='), dockKeyBtn('/', FRAC_ICON, 'fn'),
          dockKeyBtn('1'), dockKeyBtn('2'), dockKeyBtn('3'), dockKeyBtn('x', '<span class="mnv">x</span>', 'fn'), dockKeyBtn('y', '<span class="mnv">y</span>', 'fn'), dockKeyBtn('a', '<span class="mnv">a</span>', 'fn'), dockKeyBtn('b', '<span class="mnv">b</span>', 'fn'),
          dockKeyBtn('0'), dockKeyBtn('.'), dockKeyBtn('²', '<span class="mnv">x²</span>', 'fn'), dockKeyBtn('³', '<span class="mnv">x³</span>', 'fn'), dockKeyBtn('√( )', '√▢', 'fn'), dockKeyBtn('BS', '⌫', 'bs', 2),
        ];
      }
      keysEl.innerHTML = keys.join('');
      setDockCheckMode('check');
    }
    function setDockCheckMode(mode, label) {
      dockMode = mode;
      const b = document.getElementById('check-btn');
      b.classList.toggle('next-mode', mode === 'next');
      b.textContent = label || (mode === 'next' ? 'つぎへ →' : 'こたえあわせ');
      b.disabled = false;
    }
    function dockAction() {
      if (dockMode === 'next') { nextQuestion(); return; }
      checkInput();
    }
    function openDock() { if (document.body) document.body.classList.add('dock-open'); }
    function closeDock() { if (document.body) document.body.classList.remove('dock-open'); }

    function setupInput(q) {
      // UIの出し分け（判定ロジックには影響しない）
      q.uiMode = (q.inputMode === 'number' && isPureFraction(q.correct)) ? 'fraction' : q.inputMode;

      const plainRow = document.getElementById('plain-row');
      const fracW = document.getElementById('frac-widget');
      const pvRow = document.getElementById('preview-row');
      const guide = document.getElementById('input-guide');

      [ansInput(), fracNum(), fracDen()].forEach(el => {
        el.value = '';
        el.disabled = false;
        el.classList.remove('wrong-flash');
      });
      fracW.classList.remove('wrong-flash');

      if (q.uiMode === 'fraction') {
        plainRow.style.display = 'none';
        fracW.classList.add('show');
        pvRow.classList.remove('show');
        guide.textContent = 'うえ（分子）と した（分母）を タップして、パッドで数字を入れよう。マイナスは 分子に つけてね';
        setActiveField(fracNum());
      } else if (q.uiMode === 'number') {
        plainRow.style.display = 'flex';
        fracW.classList.remove('show');
        pvRow.classList.remove('show');
        ansInput().placeholder = '数を入力';
        document.getElementById('input-mode-chip').textContent = '数で答える';
        guide.textContent = IS_TOUCH ? 'したのパッドで入力してね（マイナスは −）' : 'パッドでも キーボードでも 入力できるよ（マイナスは -）';
        setActiveField(ansInput());
      } else {
        plainRow.style.display = 'flex';
        fracW.classList.remove('show');
        pvRow.classList.add('show');
        ansInput().placeholder = '式を入力';
        document.getElementById('input-mode-chip').textContent = '式で答える';
        guide.textContent = '分数は 1/2 のように打つと 下のプレビューで 教科書の形になるよ。累乗は x² キー（x のあとに押す）';
        setActiveField(ansInput());
        updatePreview();
      }

      document.getElementById('giveup-btn').classList.remove('show');
      const v = document.getElementById('verdict');
      v.className = 'verdict'; v.textContent = '';
      document.getElementById('reveal-answer').style.display = 'none';

      buildDock(q.uiMode);
      openDock();
    }

    /* 入力中の式 → 教科書表記ライブプレビュー */
    function exprPreviewHTML(s) {
      s = String(s || '').trim();
      if (!s) return '<span class="pv-empty">にゅうりょくすると ここに 教科書の形で うつるよ</span>';
      const marked = s.replace(/(\([^()]+\)|[0-9.]+[a-z]?|[a-z])\s*\/\s*(\([^()]+\)|[0-9.]+|[a-z])/gi, '[[$1/$2]]');
      return renderMath(marked);
    }
    function updatePreview() {
      const q = questions[current];
      if (!q || q.uiMode !== 'expr') return;
      document.getElementById('expr-preview').innerHTML = exprPreviewHTML(ansInput().value);
    }

    /* カーソル位置に挿入（まなびポータル padPut の移植。挿入先は activeField） */
    function padPut(tok) {
      const el = activeField || ansInput();
      if (el.disabled) return;
      const s = el.selectionStart != null ? Math.min(el.selectionStart, el.value.length) : el.value.length;
      const e = el.selectionEnd != null ? Math.min(el.selectionEnd, el.value.length) : el.value.length;
      let caret;
      if (tok === '√( )') {
        const sel = el.value.slice(s, e); // 式を選んでから押すと √( ) で囲める
        el.value = el.value.slice(0, s) + '√( ' + sel + ' )' + el.value.slice(e);
        caret = s + 3 + sel.length;
      } else {
        el.value = el.value.slice(0, s) + tok + el.value.slice(e);
        caret = s + tok.length;
      }
      applyFieldFilter(el);
      el.focus();
      const c = Math.min(caret, el.value.length);
      try { el.setSelectionRange(c, c); } catch (x) {}
      updatePreview();
    }
    function padBS() {
      const el = activeField || ansInput();
      if (el.disabled) return;
      const s = el.selectionStart != null ? Math.min(el.selectionStart, el.value.length) : el.value.length;
      const e = el.selectionEnd != null ? Math.min(el.selectionEnd, el.value.length) : el.value.length;
      const from = s === e ? Math.max(0, s - 1) : s;
      el.value = el.value.slice(0, from) + el.value.slice(e);
      el.focus();
      try { el.setSelectionRange(from, from); } catch (x) {}
      updatePreview();
    }
    /* 分数：分子⇔分母の切りかえ */
    function fracSwitch() {
      const q = questions[current];
      if (!q || q.uiMode !== 'fraction') return;
      setActiveField(activeField === fracNum() ? fracDen() : fracNum());
      activeField.focus();
    }

    /* フィールドごとの文字フィルタ（カーソル位置をなるべく保つ） */
    function applyFieldFilter(el) {
      const q = questions[current];
      if (!q || !stage || stage.kind !== 'input') return;
      let f;
      if (el.id === 'frac-num') f = filterFracNum;
      else if (el.id === 'frac-den') f = filterFracDen;
      else f = q.inputMode === 'number' ? filterNum : filterExpr;
      const filtered = f(el.value);
      if (filtered !== el.value) {
        const caret = (el.selectionStart || filtered.length) - (el.value.length - filtered.length);
        el.value = filtered;
        const c = Math.max(0, Math.min(filtered.length, caret));
        try { el.setSelectionRange(c, c); } catch (e) {}
      }
    }

    function checkInput() {
      if (answered) return;
      const q = questions[current];
      let given, flashEl;
      if (q.uiMode === 'fraction') {
        const n = fracNum().value.trim(), d = fracDen().value.trim();
        if (!n && !d) { parkToast('分子と分母を 入力してね'); return; }
        if (!n) { parkToast('うえ（分子）が からっぽだよ'); setActiveField(fracNum()); return; }
        if (!d) { parkToast('した（分母）が からっぽだよ'); setActiveField(fracDen()); return; }
        given = n + '/' + d;   // 従来の "a/b" 文字列に合成 → 既存判定へ（ロジック無変更）
        flashEl = document.getElementById('frac-widget');
      } else {
        given = ansInput().value.trim();
        if (!given) { parkToast('答えを入力してね'); return; }
        flashEl = ansInput();
      }
      if (judgeInput(q.inputMode, q.correct, given)) {
        answered = true;
        if (!hadMistake) correctCount++;
        [ansInput(), fracNum(), fracDen()].forEach(el => { el.disabled = true; });
        document.getElementById('giveup-btn').classList.remove('show');
        const v = document.getElementById('verdict');
        v.className = 'verdict ok'; v.textContent = '◎ せいかい！';
        document.getElementById('hint-box').classList.remove('show');
        if (!hadMistake) { const r = flashEl.getBoundingClientRect(); launchConfetti(r.left + r.width / 2, r.top + r.height / 2); }
        setDockCheckMode('next', current + 1 < questions.length ? 'つぎの問題へ →' : 'けっかを見る');
        setTimeout(() => document.getElementById('next-btn').classList.add('show'), 380);
      } else {
        hadMistake = true; wrongTries++;
        flashEl.classList.remove('wrong-flash');
        requestAnimationFrame(() => flashEl.classList.add('wrong-flash'));
        const v = document.getElementById('verdict');
        v.className = 'verdict ng'; v.textContent = '✕ おしい…もう一回！';
        if (q.hint) { document.getElementById('hint-text').innerHTML = renderMath(q.hint); document.getElementById('hint-box').classList.add('show'); }
        if (wrongTries >= 2) document.getElementById('giveup-btn').classList.add('show');
      }
    }

    function giveUp() {
      if (answered) return;
      answered = true; hadMistake = true;
      const q = questions[current];
      [ansInput(), fracNum(), fracDen()].forEach(el => { el.disabled = true; });
      document.getElementById('giveup-btn').classList.remove('show');
      const v = document.getElementById('verdict');
      v.className = 'verdict ng'; v.textContent = '✕ ざんねん…';
      const ra = document.getElementById('reveal-answer');
      ra.style.display = 'block';
      ra.innerHTML = `正しい答え：<b>${renderMath(q.correct)}</b>`;
      setDockCheckMode('next', current + 1 < questions.length ? 'つぎの問題へ →' : 'けっかを見る');
      document.getElementById('next-btn').classList.add('show');
    }

    function nextQuestion() {
      current++;
      current < questions.length ? showQuestion() : showResult();
    }

    /* ════════════════ 結果・★判定 ════════════════ */

    function calcStars(correct, total, ms) {
      const pct = correct / total;
      if (pct < 0.8) return 0;
      if (pct < 1) return 1;
      return ms <= total * PER_Q_MS[stage.kind] ? 3 : 2;
    }

    function showResult() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      elapsedMs = performance.now() - stageStartTs;
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('quiz-card').style.display = 'none';
      closeDock();
      if (window.MathMemo) MathMemo.close();

      const total = questions.length;
      const stars = calcStars(correctCount, total, elapsedMs);
      const improved = saveStars(stage.id, stars);

      if (stars >= 1) {
        // ★獲得ポップアップ → 結果カード
        const pop = document.getElementById('clear-pop');
        const isBoss = stage.idx === stage.world.stages.length - 1;
        document.getElementById('pop-banner').textContent = isBoss ? 'BOSS CLEAR!!' : 'STAGE CLEAR!';
        document.getElementById('pop-nyake').innerHTML = svgNyake(90);
        const popStars = document.getElementById('pop-stars');
        popStars.innerHTML = [1,2,3].map(i => `<span${i <= stars ? ' class="on"' : ''} style="animation-delay:${0.25 + i * 0.28}s">★</span>`).join('');
        pop.classList.add('show');
        launchConfetti(innerWidth / 2, innerHeight * 0.3);
        setTimeout(() => {
          pop.classList.remove('show');
          revealResultCard(stars, improved, total);
        }, 1900);
      } else {
        revealResultCard(stars, improved, total);
      }
    }

    function revealResultCard(stars, improved, total) {
      document.getElementById('res-pct').textContent = Math.round(correctCount / total * 100) + '%';
      document.getElementById('res-correct').textContent = `${correctCount}/${total}`;
      document.getElementById('res-time').textContent = formatTime(elapsedMs);

      const titles = ['ざんねん…', 'ステージクリア！', 'パーフェクト！', 'スピードパーフェクト！！'];
      const msgs = [
        '正解率8割以上で クリアだよ。ヒントを読んで もう一回チャレンジ！',
        'つぎのステージへの道が ひらいたよ！★3も ねらってみよう',
        '全問正解！あとはスピードを きわめれば ★3だ',
        '全問正解＆タイムクリア！文句なしの ★3！'
      ];
      const nyakeSay = [
        'まちがいは 経験値だにゃ。リベンジ おうえんするにゃ！',
        'やったにゃ！その調子だにゃ！',
        'パーフェクトだにゃ…！おみごとだにゃ！',
        'はやい！つよい！パークいちの実力だにゃ！'
      ];
      document.getElementById('result-title').textContent = titles[stars];
      document.getElementById('result-msg').textContent = msgs[stars] + (improved ? '（記録を更新！）' : '');
      document.getElementById('result-nyake').textContent = nyakeSay[stars];
      document.getElementById('result-nyake-face').innerHTML = svgNyake(46);

      // ★の演出
      [1, 2, 3].forEach(i => {
        const el = document.getElementById('rstar' + i);
        el.classList.remove('earned');
        if (i <= stars) setTimeout(() => el.classList.add('earned'), 300 + i * 380);
      });
      if (stars >= 1) setTimeout(() => launchConfetti(innerWidth / 2, innerHeight * 0.3), 500);
      if (stars === 3) setTimeout(() => launchConfetti(innerWidth / 2, innerHeight * 0.25), 1600);

      // つぎのステージボタン
      const nextStage = findNextStage();
      const nb = document.getElementById('btn-next-stage');
      if (stars >= 1 && nextStage && stageUnlocked(nextStage)) {
        nb.style.display = 'block';
        nb.onclick = () => openStage(nextStage.id);
      } else {
        nb.style.display = 'none';
      }

      document.getElementById('result-card').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function findNextStage() {
      const w = stage.world;
      if (stage.idx + 1 < w.stages.length) return w.stages[stage.idx + 1];
      const wi = WORLDS.indexOf(w);
      for (let i = wi + 1; i < WORLDS.length; i++) {
        if (WORLDS[i].stages.length) return WORLDS[i].stages[0];
      }
      return null;
    }

    function gotoNextStage() { /* onclick は revealResultCard で差し替え */ }

    function retryStage() {
      document.getElementById('result-card').style.display = 'none';
      openStage(stage.id);
    }

    function backToMap() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (window.MathMemo) MathMemo.close();
      closeDock();
      document.getElementById('clear-pop').classList.remove('show');
      document.getElementById('stage-screen').style.display = 'none';
      document.getElementById('map-screen').style.display = 'block';
      renderMap();
      window.scrollTo(0, 0);
    }

    /* ════════════════ 初期化 ════════════════ */

    (function init() {
      document.getElementById('hero-nyake').innerHTML = svgNyake(96);

      const fields = [ansInput(), fracNum(), fracDen()];
      fields.forEach(el => {
        if (IS_TOUCH) {
          // ネイティブキーボードを出さない（入力は画面下の固定パッドだけ）
          el.readOnly = true;
          el.inputMode = 'none';
        }
        el.addEventListener('focus', () => setActiveField(el));
        el.addEventListener('input', e => { if (!e.isComposing) { applyFieldFilter(el); updatePreview(); } });
        el.addEventListener('compositionend', () => { applyFieldFilter(el); updatePreview(); });
        el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); dockAction(); } });
      });

      if (window.MathMemo) MathMemo.attach({ btnId: 'memo-toggle', boxId: 'memo-box' });
      renderMap();

      // ディープリンク：#stage=<ステージID> で直接ひらく（!go付きで即スタート）
      if (typeof location !== 'undefined' && location.hash) {
        const m = location.hash.match(/stage=([^!&]+)(!go)?/);
        if (m) {
          const st = ALL_STAGES.find(s => s.id === decodeURIComponent(m[1]));
          if (st && stageUnlocked(st)) { openStage(st.id); if (m[2]) startStage(); }
        }
      }
    })();
  </script>
